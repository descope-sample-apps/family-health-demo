name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # The build only needs this to be present, not valid - no network calls happen at build
          # time. Real values are supplied by the deployment environment.
          NEXT_PUBLIC_DESCOPE_PROJECT_ID: Pxxxxxxxxxxxxxxxxxxxxxxxxxxx
